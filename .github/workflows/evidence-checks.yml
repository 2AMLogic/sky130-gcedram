name: evidence-checks

# Runs the stdlib-Python checks that guard the evidence chain: the
# loaded-column analysis tests, the cold-corner variant tests, the
# evidence-index consistency check, the append-only evidence guard's
# fixture suite, the refresh-overhead arithmetic tests, and the shared
# evidence-helper tests. No ngspice, no klt, no network (check_evidence_index.py is
# run without --online). Keep this list in sync with the `test` script in
# package.json.
#
# The `append-only` job (issue #67) compares committed sim/ evidence blobs
# between the PR's merge base and head commit. It runs on the `pull_request`
# event (fork PRs get a read-only token and no secrets) and on `merge_group`
# (the merge queue's trial merge, issue #355; the queue re-runs required
# checks against the queued merge result, so evidence cannot land on a base
# it was not checked against). It passes the event's immutable base/head SHAs
# through env vars (no PR text is interpolated into shell), checks out full
# history, and fails closed if either commit or any blob is unavailable.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  evidence-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Loaded-column analysis tests
        run: python3 -I sim/loaded-column/test_analysis.py

      - name: Loaded-column klt request generator / reducer (issue #169) checks
        run: python3 -I sim/loaded-column/test_gen_column_requests.py

      - name: Bitcell-transient request generator / reducer (issue #182) checks
        run: python3 -I sim/bitcell-transient/test_gen_bitcell_transient.py

      - name: Cold-corner variant tests
        run: python3 -I sim/loaded-column/cold-corner/test_variants.py

      - name: Evidence index check
        run: python3 -I sim/loaded-column/cold-corner/check_evidence_index.py

      - name: Sense-stage checks
        run: python3 -I sim/sense-stage/test_sense_stage.py

      - name: Aged write/hold/read checks
        run: python3 -I sim/aged-read/test_aged_read.py

      - name: Repeated closed-loop refresh (issue #147) checks
        run: python3 -I sim/closed-loop-refresh/test_closed_loop.py

      - name: Extracted-C_RBL loaded-column (klt harness, issue #88) checks
        run: python3 -I sim/loaded-column/extracted-crbl/test_column_klt.py

      - name: Refresh-operation (sense + write-back) checks
        run: python3 -I sim/refresh-op/test_refresh_op.py

      - name: RTL-strobe replay (converter, consistency check, analysis) checks
        run: python3 -I sim/refresh-replay/test_refresh_replay.py

      - name: Refresh-replay matched initialization controls (issue #139) checks
        run: python3 -I sim/refresh-replay/test_init_control.py

      - name: Refresh energy / standby power checks
        run: python3 -I sim/refresh-energy/test_refresh_energy.py

      - name: Sense-latch design-vs-deck drift check
        run: python3 -I design/test_sense_latch.py

      - name: Normalizer raw-to-normalized freshness check (issue #229)
        run: python3 -I design/test_normalize_netlist.py

      - name: Column-periphery slice design-vs-deck drift check
        run: python3 -I design/test_column_periphery.py

      - name: Column-periphery comparison checks
        run: python3 -I sim/column-periphery/test_column_periphery.py

      - name: Sense-stage mismatch (Monte Carlo) checks
        run: python3 -I sim/sense-mismatch/test_sense_mismatch.py

      - name: Write-disturb checks
        run: python3 -I sim/write-disturb/test_write_disturb.py

      - name: Append-only guard fixture tests
        run: python3 -I sim/test_append_only.py

      - name: Item-9 inventory fixture tests (issue #371)
        run: python3 -I sim/test_check_item9_inventory.py

      - name: Item-9 inventory completeness (every sim/ bench inventoried, issue #371)
        run: python3 -I sim/check_item9_inventory.py

      - name: Array-context C_SN comparison (issue #89) checks
        run: python3 -I sim/retention/test_compare_array_c_sn.py

      - name: Array generation pin and baseline comparison (issue #91) checks
        run: python3 -I layout/test_generation_reproducibility.py

      - name: Geometry-matched access leakage (issue #149) checks
        run: python3 -I sim/leakage/test_geometry_leakage.py

      - name: Refresh-overhead arithmetic tests
        run: python3 -I sim/refresh-overhead/test_refresh_overhead.py

      - name: Bitcell compaction variants (issue #100) consistency checks
        run: python3 -I layout/compact/test_compact.py

      - name: Compact-layout parasitics, leakage and retention-budget (issue #161) checks
        run: python3 -I sim/retention/test_compare_compact_c_sn.py

      - name: Device-inclusive compact C_SN (issue #208) checks
        run: python3 -I sim/retention/test_compact_device_c_sn.py

      - name: Shared klt request skeleton tests (issue #196)
        run: python3 -I sim/test_klt_request.py

      - name: PDK model-closure identity checker tests (issue #338)
        run: python3 -I sim/pdk-closure-identity/test_check_closure_identity.py

      - name: Shared evidence helper tests
        run: python3 -I sim/test_evidence_common.py

      - name: Artifact-store writer (issue #218) fail-closed checks
        run: python3 -I sim/test_store_evidence.py

      - name: Artifact manifest checker (issue #218) fixture tests
        run: python3 -I scripts/tests/test_check_artifact_manifests.py

      - name: "Artifact manifests (schema, artifact: URIs, no committed bytes)"
        run: python3 -I scripts/check_artifact_manifests.py check

  append-only:
    # merge_group must run the job too: a gate that skips on the queue's
    # trial merge is a silent drop of the required context, not a pass.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact base and head commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # Merge queue (issue #355; plumbing shape from sky130-comparator
          # #332): the trial-merge base/head come from the event payload, and
          # there is no refs/pull/N/head ref there, so both commits are
          # fetched by SHA. An empty or unreachable SHA fails closed.
          if [ "$EVENT" = "merge_group" ]; then
            : "${MG_BASE:?merge_group.base_sha missing from the event payload}"
            : "${MG_HEAD:?merge_group.head_sha missing from the event payload}"
            BASE_SHA="$MG_BASE"
            HEAD_SHA="$MG_HEAD"
            git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          else
            # Head lives at refs/pull/N/head (also for forks); fetch both by
            # ref and SHA so the check never relies on a moving branch tip.
            git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head" "$BASE_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          test "$(git rev-parse --is-shallow-repository)" = false

      - name: Append-only evidence check
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # Prefer the checker as committed on the base branch, so changing
          # sim/check_append_only.py in a PR does not change the check applied
          # to that PR; fall back to the PR's copy only when the base does not
          # have one yet (the PR introducing it). Edits to this workflow file
          # still require review: it runs from the event's merge ref under
          # the pull_request and merge_group events.
          if [ "$EVENT" = "merge_group" ]; then
            BASE_SHA="$MG_BASE"
            HEAD_SHA="$MG_HEAD"
          fi
          checker="$RUNNER_TEMP/check_append_only.py"
          if git cat-file -e "${BASE_SHA}:sim/check_append_only.py" 2>/dev/null; then
            git show "${BASE_SHA}:sim/check_append_only.py" > "$checker"
          else
            cp sim/check_append_only.py "$checker"
          fi
          python3 -I "$checker" --base "$BASE_SHA" --head "$HEAD_SHA"
